services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ask-sangam-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
    volumes:
      - ./backend/data:/app/data
      - ./backend/documents:/app/documents
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sangam-network

  frontend:
    build:
      context: ./frontend/vite-project
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    container_name: ask-sangam-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sangam-network

networks:
  sangam-network:
    driver: bridge
